services:
  # ---------------------------------------------------------
  # App Service: PHP-FPM
  # ---------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        VITE_APP_NAME: ${APP_NAME:-Lentera}
    container_name: lentera_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lentera_network

  # ---------------------------------------------------------
  # Web Service: Nginx
  # ---------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_APP_NAME: ${APP_NAME:-Lentera}
    container_name: lentera_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - lentera_network

  # ---------------------------------------------------------
  # Queue Worker: Laravel Queue
  # ---------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: lentera_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lentera_network

  # ---------------------------------------------------------
  # Scheduler: Laravel Schedule Runner
  # ---------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: lentera_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lentera_network

  # ---------------------------------------------------------
  # Database Service: PostgreSQL
  # ---------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: lentera_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lentera}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lentera_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-lentera}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lentera_network

networks:
  lentera_network:
    driver: bridge

volumes:
  storage_data:
  pg_data:
